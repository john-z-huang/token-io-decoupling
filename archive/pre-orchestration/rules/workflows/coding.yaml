schema_version: 1
id: coding-selector
markdown_path: workflows/coding.md
title: Coding 工作流
blocks:
  - body:
      kind: markdown
      text: |-
        当仓库文本、开发工具输出、实现、测试、文档或 Git 状态是主要工作状态时，使用本工作流。本文件只负责 Coding 路线选择和完成索引。Layer-03 决策检查点判断当前任务的适用性与分支；选定的 Layer-04 路线排列这些决策，并组合执行所需的 Layer-01 概念与 Layer-02 检查点动作。根指令模式和委派规则由模式检查点组合的原子委派 references 负责；父级控制的记录保存会话级模式/数量选择和当前任务状态。

        ## 入口

        从 Skill 读取路线指令及适用 Hook，不加载归档扩展或依赖其状态机。详细 owner 仍为权威；原有模式默认值和门禁保持不变。

        1. 在路线选择前完成 Contract 检查点。
        2. 识别真实运行环境，完成运行环境检查点，并建立或加载[运行环境能力清单](../references/coding/layer-02-workflow-concepts/entry-and-context/environment-capability-inventory.yaml)。各阶段按适用 Hook 所需的操作和证据，从当前环境中选择可用且获准的工具。
        3. 通过消费已建立的运行环境能力清单的模式检查点，组合根指令模式门禁所需的委派 references。
        4. 使用当前证据调用[路线入口](../references/coding/layer-03-workflow-checkpoints/route-entry.yaml)，确认 Contract、运行环境、能力清单和 Mode 均已通过。只选择其授权的完整路线，并将已释放的 mode/count 证据交给首个模块检查点 SM01/MM01。每条路线依次组合[入口就绪](../hooks/entry.yaml)、[Session 就绪](../hooks/session.yaml)、[工作定义](../hooks/planning.yaml)、对应模式的执行模块、[验证与修复](../hooks/verification.yaml)、[文档](../hooks/documentation.yaml)和[交付与验收](../hooks/delivery.yaml)。按已选路线和当前阶段读取相应 Hook 的触发条件及检查点。

        所有现有及未来路线均通过工作定义和执行检查点消费[任务计划 Memory 生命周期](../references/coding/layer-01-fundamental-concepts/execution-planning/task-plan-memory-lifecycle.yaml)。向执行阶段传递共享计划身份、当前计划证据与持久化确认，或有记录的限制例外；完成 owner 要求的任何内容核验。在 owner 规定的阶段、交接、暂停和完成边界记录更新；影响授权、范围、验收、方向或依赖动作的变化仍须在该动作前记录。只有匹配计划生命周期已解决后才完成。无需额外规划请求。

        ## 路线

        - [单代理 Coding](coding-single-agent.yaml)：用户明确选择 `mode: Single-Agent Coding` 时使用；与指令相关的任务事项留在当前 Session 中完成。
        - [多代理 Coding](coding-multi-agent.yaml)：已释放的 Mode 选择 Multi-Agent Coding 且已锁定正整数 `child_count` 时使用。Mode 检查点负责四项菜单、默认值和无效输入处理；锁定预算不初始化子代理。

        不要同时加载两条路线。如果后续实质事实使路线失效，停止当前切片，按需修改 Contract，并返回路线入口。

        ## 文档层级

        这些层级规定组合方向，不改变策略归属。所有文档仅维护中文权威正文，依赖链接指向当前无语言后缀的文件。

        | 层级 | 作用 | 允许依赖的目标 |
        | --- | --- | --- |
        | [`layer-01-fundamental-concepts`](../references/coding/layer-01-fundamental-concepts/README.yaml) | 基础原子概念 | layer-01 概念 |
        | [`layer-02-workflow-concepts`](../references/coding/layer-02-workflow-concepts/README.yaml) | 通用工作流检查点动作与证据 | `layer-01-fundamental-concepts`；不得链接 layer-03/04 |
        | [`layer-03-workflow-checkpoints`](../references/coding/layer-03-workflow-checkpoints/README.yaml) | 当前任务的适用性、分支与组合决策 | layer-01、layer-02；不得链接更后的层 |
        | [`hooks`](../hooks/README.yaml) | 阶段检查点及触发合同 | 共享协议和 Layers 01–03 的规则 |
        | [完整 Coding 路线](README.yaml) | 两条完整路线和跨阶段返回规则 | 绑定各阶段 Hook，按需引用前置规则 |
        | `workflows/coding.md` | 路线选择器和四层索引 | 四个层级；只负责导航，不拥有策略 |

        如果低层文档需要由高层拥有的概念，应拆分低层文档，并把组合关系上移到高层。`SKILL.md`、`README.md` 和 `docs/` 等根入口文档可以向下链接到入口。仓库维护时按文档规范检查层级边界，维护一份中文权威正文。

        ## 检查点目录

        路线按序消费 [layer-02 检查点](../references/coding/layer-02-workflow-concepts/README.yaml)、[layer-03 工作流决策](../references/coding/layer-03-workflow-checkpoints/README.yaml)，并由 Coding 路线组合以下独立动作边界：

        `contract` → `environment`（+ 能力清单）→ `mode` → `context` → `decision` → `implementation` → `control` → `verification` → `repair` → `documentation` → `git` → `acceptance`

        目录只用于导航。检查点不负责路由到另一个检查点；选定路线定义实际顺序，并记录跳过条件检查点的原因。

        ## 完成

        只有选定路线以当前证据通过验收后，才能返回 `COMPLETE`。报告不可用检查、假设、剩余风险、已授权影响和已记录的委派状态。没有明确授权时不得产生外部影响。
