              | [context-exchange.md](../references/coding/layer-01-fundamental-concepts/context-exchange/context-exchange.yaml) | 上下文交换边界及读取原则 |
              | [content-memo.md](../references/coding/layer-01-fundamental-concepts/context-exchange/content-memo.yaml) | memo定义、授权与内容要求 |
              | [content-memo-dispatch.md](../references/coding/layer-01-fundamental-concepts/context-exchange/content-memo-dispatch.yaml) | 默认内容类型及派发授权 |
              | [content-memo-lifecycle.md](../references/coding/layer-01-fundamental-concepts/context-exchange/content-memo-lifecycle.yaml) | 写入、登记、更新与归档 |
              | [context-exchange-handoff.md](../references/coding/layer-01-fundamental-concepts/context-exchange/context-exchange-handoff.yaml) | handoff内容和返回路径 |
              | [context-exchange-workspace-boundary.md](../references/coding/layer-01-fundamental-concepts/context-exchange/context-exchange-workspace-boundary.yaml) | 跨workspace边界 |
