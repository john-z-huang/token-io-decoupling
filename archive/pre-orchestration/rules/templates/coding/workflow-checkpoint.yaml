layouts:
  - [overview, inputs, decision-and-result, failure-boundary, related]
  - [overview, section-01, decision-and-result, failure-boundary, related]
block_rules:
  overview:
    kind: markdown
    expose: true
  inputs:
    kind: section
    expose: true
  decision-and-result:
    kind: section
    expose: true
  failure-boundary:
    kind: section
    expose: true
  related:
    kind: section
    expose: true
  section-01:
    kind: section
    expose: true
document:
  schema_version: 1
  document_type: workflow-checkpoint
  id: example-workflow-checkpoint
  markdown_path: references/coding/layer-03-workflow-checkpoints/example-workflow-checkpoint.md
  title: 工作流检查点示例
  blocks:
    - overview:
        kind: markdown
        title: 概览
        expose: true
        text: 说明该检查点所负责的决定及其调用位置。
    - inputs:
        kind: section
        title: 触发与输入
        expose: true
        blocks:
          - inputs-body:
              kind: markdown
              text: 说明触发条件、当前输入和所需证据。
    - decision-and-result:
        kind: section
        title: 决策与结果
        expose: true
        blocks:
          - decision-and-result-body:
              kind: markdown
              text: 描述判定方式及结果的使用方式。
    - failure-boundary:
        kind: section
        title: 失败边界
        expose: true
        blocks:
          - failure-boundary-body:
              kind: markdown
              text: 说明缺少证据或结果冲突时如何返回调用方。
    - related:
        kind: section
        title: 相关概念
        expose: true
        blocks:
          - related-body:
              kind: markdown
              text: '- 链接到提供输入或判定依据的规则。'
