# yaml-language-server: $schema=../../reference.schema.json
schema_version: 1
id: codex-host
markdown_path: references/hosts/codex.md
title: "Codex 宿主适配"
blocks:
  - session:
      kind: markdown
      title: "加载和会话"
      expose: true
      text: |-
        从 Codex 发现的项目 Skill 目录加载，按需显式调用本 Skill。使用当前 Codex 线程的真实上下文核对身份、角色与已确认的模式和数量。续接、compact 和同线程后续轮次延续已核验状态。新线程或 fork 重新应用模式和数量门禁。当前线程、其他线程、子代理和 worktree 分别核验证据。线程标题、路径及截取的历史正文不能认证身份。

        只使用宿主实际暴露的能力。交互不可用时，从真实用户指令取得所需模式及审计偏好，字段缺失则暂停依赖项。原生规划视图只表示当前计划，不增加写入或实施授权。Codex 的沙箱、写入审批、网络与管理员限制继续生效。Skill 的执行合同由 Agent 按阶段读取，宿主原生 Hook 需要独立配置和信任。
  - delegation:
      kind: markdown
      title: "委派和模型"
      expose: true
      text: |-
        先通过共同的模式、数量、职责与 Slice 门禁，并确认 Codex 当前会话允许委派。使用宿主已暴露的原生创建、任务、等待、通信与取消能力。把真实子代理身份及调用回执与已预留名额绑定。等待实际正文再接续，不从通知、空闲状态或最终摘要猜测完整日志。会话或客户端不支持续接时，只阻塞依赖续接的步骤。禁止用新线程、Shell 或其他入口绕过权限或预算。

        核验当前 Codex 客户端的继承契约。原生子代理继承父轮次的有效 provider 配置、沙箱和审批设置。已核实该契约适用于当前客户端和创建方式，且实际调用无 provider 或端点覆盖时，可将继承记录为同端点证据，无须取得宿主未公开的地址或凭据。若接入方另有路由、契约不明或证据冲突，暂停创建。 [Codex 子代理配置](https://learn.chatgpt.com/docs/agent-configuration/subagents#custom-agents)

        若有子代理默认模型、角色配置或显式模型覆盖，核实其生效优先级和当前 provider 的模型可用性。只传实际接受的模型和推理强度设置。按任务明确控制历史继承，未获准共享时选择空历史；如果工具不提供必要的上下文或权限边界，暂停受影响委派。工具返回身份只证明实际创建，独立验证还需核实任务边界和证据。
  - memory:
      kind: markdown
      title: "项目 Memory"
      expose: true
      text: |-
        发现当前 Codex 会话已配置且获准的项目 Memory 后端，例如可信 MCP 提供的具名项目知识。核实返回的项目绑定、共享范围、权限和实际参数，再调用最小必要操作。为计划分别确认读取、写入、保全核验及归档能力。只读连接不提供写入和归档授权。需要另配后端时报告具体缺口，由用户按照宿主配置与审批另行授权。

        Codex 用户记忆、线程历史、规划状态和仓库文件各自遵循其实际语义。仅当某个后端能提供共同合同要求的项目绑定、访问边界、持久化及归档证据时，才能用于对应的项目 Memory 操作。没有合适后端时，继续独立的获准工作并暂停依赖步骤。
