# yaml-language-server: $schema=../../../reference.schema.json
schema_version: 1
document_type: workflow-checkpoint
id: repair-disposition
markdown_path: references/coding/layer-03-workflow-checkpoints/repair-disposition.md
title: "修复处置"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本检查点负责失败或实质性决策变化后的路线级恢复和重新验证路由。
  - inputs:
      kind: section
      title: "触发与输入"
      expose: true
      blank_lines_before: 2
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              当前 Verification 失败或决策发生重大变化后，使用本检查点路由恢复流程。应用[Repair](../layer-02-workflow-concepts/verification-and-repair/repair.yaml)、[Repair Scope Gate](../layer-02-workflow-concepts/verification-and-repair/repair-scope-gate.yaml)、[Repair Execution](../layer-02-workflow-concepts/verification-and-repair/repair-execution.yaml)和[Repair Verification Handoff](../layer-02-workflow-concepts/verification-and-repair/repair-verification-handoff.yaml)。
  - decision-and-result:
      kind: section
      title: "决策与结果"
      expose: true
      blocks:
        - decision-and-result-body:
            kind: markdown
            text: |-
              1. 必须提供具体失败证据、受影响路径和最小修复候选。没有具体失败的语义变更不能算作 Repair；应作为重大决策变化路由。
              2. 用当前 Contract 和 Decision 应用 Repair 范围门禁。只释放获授权的窄范围修复及其定向检查。
              3. 记录修复交接、新指纹和受影响 epoch；将当前证据交给 Verification，并在依赖工作前重跑所有变更 epoch 所需检查。
              4. 重大决策变化应向调用方返回变更后的 Contract/Decision 事实和证据，以便重新审查 Contract 与 Decision 并调度路线。无具体失败时，返回 Repair `Not applicable` 及证据依据。若已验收的 epoch 发生变化，依赖工作继续前必须取得当前 Verification 证据。
  - failure-boundary:
      kind: section
      title: "失败边界"
      expose: true
      blocks:
        - failure-boundary-body:
            kind: markdown
            text: |-
              诊断、授权、有界范围、handoff 证据或变更 epoch 后重新验证缺失时，阻塞依赖路线。修复意图不构成授权，也不得复用过期通过证据。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Repair Scope Gate](../layer-02-workflow-concepts/verification-and-repair/repair-scope-gate.yaml)
