# yaml-language-server: $schema=../../../reference.schema.json
schema_version: 1
document_type: workflow-checkpoint
id: workflow-navigation-selection
markdown_path: references/coding/layer-03-workflow-checkpoints/workflow-navigation-selection.md
title: "工作流导航选择"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本检查点判断当前任务是否适合使用有界工作流导航或结构输入检查。这些都是无状态辅助能力；调用方提供的事实和权威 owner 文档仍是判断策略与结果的依据。
  - inputs:
      kind: section
      title: "触发与输入"
      expose: true
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              使用当前[环境](../layer-02-workflow-concepts/entry-and-context/environment.yaml)及[能力清单](../layer-02-workflow-concepts/entry-and-context/environment-capability-inventory.yaml)结果。可选导航可能有帮助时，参考[工作流导航可用性](../layer-01-fundamental-concepts/workflow-navigation/navigation-availability.yaml)和[工作流规则上下文](../layer-01-fundamental-concepts/workflow-navigation/rule-context.yaml)。若对所供检查点事实执行结构检查可能有帮助，则应用[检查点结构检查](../layer-01-fundamental-concepts/workflow-navigation/checkpoint-structure-checks.yaml)。除非任务本身要求相关结果，否则两种辅助能力均为可选。
  - decision-and-result:
      kind: section
      title: "决策与结果"
      expose: true
      blocks:
        - decision-and-result-body:
            kind: markdown
            text: |-
              1. 找出当前判断所需的权威 owner 文档。
              2. 若可选导航有用且可用，仅使用其返回的有界当前上下文。将来源/Hash/status 视为导航证据；它不能证明身份、权限、语义真实性、检查点完成、跨调用顺序或验收。
              3. 若结构检查有用，则将结构结果与所供输入和当前 owner 对照，再独立判断事实及证据含义。检查不能证明身份、权限、语义真实性、检查点完成、跨调用顺序或验收。
              4. 任一可选辅助能力无用时，记录附有理由的 `Not applicable`；不得仅为产出结果而额外查询或检查。直接读取必需的权威 owner。
              5. 若辅助能力不可用或不完整，且当前授权能力可以访问权威文档，则直接使用并记录限制。若无法获取必需 owner，则阻塞依赖该判断的工作。
              6. 返回所选来源和任何所需的结构检查结果供审阅。本决策不会更改工作流状态、授权操作或建立检查点结果。
  - failure-boundary:
      kind: section
      title: "失败边界"
      expose: true
      blocks:
        - failure-boundary-body:
            kind: markdown
            text: |-
              | 结果 | 必需操作 |
              | --- | --- |
              | 不需要可选导航 | 记录 `Not applicable`；直接读取必需的权威 owner。 |
              | 有界导航可用 | 审阅当前返回来源并读取未覆盖的直接 owner；独立判断任务事实。 |
              | 不需要或无法进行可选结构检查 | 附理由记录 `Not applicable`；除非任务本身要求该结构结果，否则依据权威 owner 继续。 |
              | 结构检查可用且已选择 | 依据当前 owner 和调用方所供输入审阅结果；独立判断证据含义。 |
              | 导航不可用/不完整但直接 owner 可访问 | 直接阅读 owner 并记录限制。 |
              | 无法访问必需权威 owner | 仅阻塞依赖该判断的工作；不得推断或跳过其策略。 |
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [工作流导航可用性](../layer-01-fundamental-concepts/workflow-navigation/navigation-availability.yaml)
              - [工作流规则上下文](../layer-01-fundamental-concepts/workflow-navigation/rule-context.yaml)
              - [运行环境能力清单](../layer-02-workflow-concepts/entry-and-context/environment-capability-inventory.yaml)
