# yaml-language-server: $schema=../../../reference.schema.json
schema_version: 1
document_type: workflow-checkpoint
id: documentation-impact
markdown_path: references/coding/layer-03-workflow-checkpoints/documentation-impact.md
title: "文档影响"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本检查点负责文档/内容变更后的路线级影响分类和返回路由。
  - inputs:
      kind: section
      title: "触发与输入"
      expose: true
      blank_lines_before: 2
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              Documentation 或获批内容变更后，判断 implementation/content、documentation 或 Contract 证据是否改变。应用[Documentation](../layer-02-workflow-concepts/completion-and-effects/documentation.yaml)和[Verification Epoch](../layer-02-workflow-concepts/verification-and-repair/verification-epoch.yaml)。
  - decision-and-result:
      kind: section
      title: "决策与结果"
      expose: true
      blocks:
        - decision-and-result-body:
            kind: markdown
            text: |-
              1. 记录变更前后指纹，并分类每个受影响维度：实现/内容、文档、Git 元数据或多个维度。为每项分类附上证据。
              2. 列出必需检查、仍可复用的证据，以及每个未变维度未变化的理由。无变化结果应带指纹证据并记录为 `Not applicable`。
              3. 重新核验变更维度。若内容改变行为、Contract 或验收，将证据返回实现/内容 Verification；若仅文档变化，返回文档检查及未变维度理由。
              4. 向路线调度返回分类、指纹、检查、复用理由和 Verification 处置结果。
  - failure-boundary:
      kind: section
      title: "失败边界"
      expose: true
      blocks:
        - failure-boundary-body:
            kind: markdown
            text: |-
              影响未知、必需检查缺失或证据过期时阻塞 Acceptance。保留受影响/不受影响维度判断及输出授权范围；变更 epoch 后不得复用旧证据。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Documentation](../layer-02-workflow-concepts/completion-and-effects/documentation.yaml)
