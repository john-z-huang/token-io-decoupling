      kind: section
      title: "相关概念"
      expose: true
      blank_lines_before: 2
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [运行时与能力边界](runtime-provider-support.yaml) — 核验当前宿主能力与授权。
              - [Session Context Firewall](session-context-firewall.yaml) — 限定当前任务的上下文来源与访问范围。
              - [任务计划 Memory 生命周期](../execution-planning/task-plan-memory-lifecycle.yaml) — 定位任务计划的命名、更新和归档规则。
              - [Worker Content Memo](../context-exchange/content-memo.yaml) — 定位 Worker 执行状态的归属。
              - [Coding Context Exchange](../context-exchange/context-exchange.yaml) — 定位 capsule 和权威来源规则。
              - [Coding Context Exchange Workspace Boundary](../context-exchange/context-exchange-workspace-boundary.yaml) — 定位 Memory 逻辑命名与授权。
