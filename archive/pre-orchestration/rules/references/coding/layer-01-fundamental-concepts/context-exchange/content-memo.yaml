# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: content-memo
markdown_path: references/coding/layer-01-fundamental-concepts/context-exchange/content-memo.md
title: "Worker Content Memo"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档定义以项目 Memory 持久化的 Worker 执行 memo 内容契约，不定义 dispatch 开关或生命周期。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - purpose-and-content:
            kind: section
            title: "用途与内容"
            expose: true
            blocks:
              - purpose-and-content-body:
                  kind: markdown
                  text: |-
                    使用 Memory 逻辑名称 `context-exchange/workers/<worker-context-id>/content-memo`，实际存储位置以获准后端配置为准。遵守已放行任务中的归属指令。名称只表示逻辑归属；Worker 级可见性、只读访问或文件系统隔离须分别核实。

                    Worker 编写的 prose 使用中文。路径、文件名、命令、symbol、key、hash、准确错误和日志片段保留原文。只记录稳定且可复用的执行状态：完成结果、发现、变更路径/symbol、验证证据、失败方案、剩余工作、阻塞和 handoff 需求。保留指向权威来源的准确指针，不把来源全文作为权威副本存入 Memory。
        - restricted-content-and-availability:
            kind: section
            title: "禁止材料和能力不可用"
            expose: true
            blocks:
              - restricted-content-and-availability-body:
                  kind: markdown
                  text: |-
                    不得写逐命令日志、完整日志/diff、大段源码副本、秘密、私有推理、完整 transcript、无关历史或父级实时 mode/count/allocation/epoch 状态。必需的 Memory 读写能力不可用时，报告限制并阻塞依赖该记录的工作；不得回退到文件写入该记录。独立工作可以继续。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              需要 Memory 时，按当前环境选择实际可用且获准的项目 Memory 能力，核对后端项目绑定、操作说明、参数、权限和结果。普通文档访问不得代替必需的 Memory 操作；能力缺失仅阻塞依赖项。不得绕过隐藏、拒绝或访问限制，也不得伪造旧身份上下文。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Worker Content Memo Dispatch](content-memo-dispatch.yaml) — 定位 Memory 写入开关。
              - [Worker Content Memo Lifecycle](content-memo-lifecycle.yaml) — 定位更新与发现规则。
