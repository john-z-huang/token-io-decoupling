# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: context-exchange-workspace-boundary
markdown_path: references/coding/layer-01-fundamental-concepts/context-exchange/context-exchange-workspace-boundary.md
title: "Coding Context Exchange 工作区边界"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档定义以项目 Memory 持久化的 Agent 上下文记录的逻辑命名和授权，不定义代码工作区文件系统权限、capsule 内容、新鲜度或 handoff 授权。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - memory-ownership:
            kind: section
            title: "Memory 名称与逻辑归属"
            expose: true
            blocks:
              - memory-ownership-body:
                  kind: markdown
                  text: |-
                    上下文记录使用按斜杠分段的项目 Memory 逻辑名称。实际存储位置、名称映射及配置覆盖以获准后端为准。保留原记录布局作为名称：`context-exchange/INDEX`；`context-exchange/workers/<worker-context-id>/INDEX`；`context-exchange/workers/<worker-context-id>/content-memo`；以及 `context-exchange/context-bootstrap/MANIFEST`、`.../project-context`、`.../policy-context`。其他 handoff/import 记录沿用原 basename 和子目录意图映射。

                    Memory 名称只表示逻辑归属。Agent 必须遵守已放行任务对可读写名称的指令。Worker 级可见性隔离、只读 ACL 或 OS/RW/RO/DENY 等限制各自需要实际证据；不能从命名空间、目录、`.gitignore` 或 worktree 推断。

                    代码与权威仓库文件访问仍受各自单独批准的文件系统/工具边界约束。Memory capsule 可保存精简事实、准确权威来源指针、hash、新鲜度和范围；不得把来源全文作为权威副本存入 Memory。父级实时 mode/count/allocation/epoch 状态仍归其原 owner，不写入这些 Memory。秘密、完整 transcript 和私有推理仍禁止。

                    必需的项目 Memory 能力不可用时，报告限制并阻塞依赖读取或写入该上下文记录的工作。不得回退为文件副本。独立工作可以继续。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              需要 Memory 时，按当前环境选择实际可用且获准的项目 Memory 能力，核对后端项目绑定、操作说明、参数、权限和结果。普通文档访问不得代替必需的 Memory 操作；能力缺失仅阻塞依赖项。不得绕过隐藏、拒绝或访问限制，也不得伪造旧身份上下文。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Context Exchange](context-exchange.yaml) — 定位 capsule 内容与新鲜度规则。
              - [Coding Context Exchange Handoff](context-exchange-handoff.yaml) — 定位 handoff 记录内容。
              - [Coding Session Context Firewall](../session-runtime/session-context-firewall.yaml) — 定位有界输入规则。
              - [Coding Child Dispatch](../delegation/delegation-child-dispatch.yaml) — 定位任务授权。
