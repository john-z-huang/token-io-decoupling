# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: context-exchange
markdown_path: references/coding/layer-01-fundamental-concepts/context-exchange/context-exchange.md
title: "Coding Context Exchange"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档定义已分配 Coding Worker 在项目 Memory 中的 上下文 capsule 内容与新鲜度规则，不定义 Memory 命名/授权、handoff 记录、任务含义、Agent 拓扑或验收。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - capsule-authority:
            kind: section
            title: "Capsule 内容与权威来源"
            expose: true
            blocks:
              - capsule-authority-body:
                  kind: markdown
                  text: |-
                    只有已授权 handoff 或 context bootstrap 需要持久记录时才写入 capsule。内容限于精简中性事实、指向权威来源的准确指针、hash、新鲜度/失效数据和窄范围证据指针。不得把来源文件全文复制到 Memory；权威仓库文件仍具有约束力。接收 Worker 只读取已放行任务中点名的 capsule Memory，再对照获准且点名的来源核实所需事实。

                    使用以下 bootstrap Memory 名称保留原文件名：`context-exchange/context-bootstrap/MANIFEST`、`context-exchange/context-bootstrap/project-context` 和 `context-exchange/context-bootstrap/policy-context`。`MANIFEST` 记录快照身份、hash 和新鲜度规则；其他 Memory 保存中性项目事实/指针及 policy-routing 指针。其他交换/import 记录在 `context-exchange/` 下沿用原 basename 和子目录意图。

                    根据 `HEAD`/tree、tracked-delta fingerprint、所列来源 hash、相关未跟踪状态和当前 task/scope 检查新鲜度。实质字段变化时只刷新受影响条目；否则直接读取点名权威来源。Capsule 不能替代 Contract 或最终状态的独立验证。Memory 列表/读写能力不可用时，报告限制并阻塞依赖工作；不得回退为文件存储。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              需要 Memory 时，按当前环境选择实际可用且获准的项目 Memory 能力，核对后端项目绑定、操作说明、参数、权限和结果。普通文档访问不得代替必需的 Memory 操作；能力缺失仅阻塞依赖项。不得绕过隐藏、拒绝或访问限制，也不得伪造旧身份上下文。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Context Exchange Workspace Boundary](context-exchange-workspace-boundary.yaml) — 定位逻辑命名和授权。
              - [Coding Context Exchange Handoff](context-exchange-handoff.yaml) — 定位 handoff 记录内容。
              - [Coding Session Context Firewall](../session-runtime/session-context-firewall.yaml) — 定位有界输入规则。
              - [Coding Child Dispatch](../delegation/delegation-child-dispatch.yaml) — 定位已放行任务授权。
