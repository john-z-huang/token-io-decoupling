# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: delegation-child-role-allocation
markdown_path: references/coding/layer-01-fundamental-concepts/delegation/delegation-child-role-allocation.md
title: "Coding 子 Agent 职责分配"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档负责在 Multi-Agent count 已 locked 时进行名额和辅助职责分配。不定义子 Agent 创建、Dispatch Preview、Worker 边界、复用或替换、生命周期、上下文传输、验证或 Git 策略。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - section-01:
            kind: section
            title: "职责分配"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    在任务上下文和 Decision 完成前，先将锁定数量预留为未绑定、未分配职责的名额。该预留阶段不得仅因只有一个名额就选择或分配 Primary Output；名额保持 `role: unassigned`、`slice_status: pending` 和 `agent: unbound`。Root 审阅当前任务上下文和 Decision 后，使用[子代理职责选择](child-role-selection.yaml)为拟创建子代理确定一个职责；用户明确指令可跳过职责选择建议，但不能跳过 Root 的职责和政策检查。若上下文生成或建议能力不可用，Root 可直接根据当前 owner 和核实事实作出判断。随后在一个未分配名额中预留所选职责，并在创建子代理前放行职责及具体 Slice。普通非 Skill 文档仍由父级编写且不消耗预留名额，即使任务同时包含代码工作也一样。每项独立职责各自消耗一个名额。尚未创建子代理的 unbound 名额可由父级授权在当前数量内调整职责计划，但新职责不得分配给其他任何已预留或已创建子代理。子代理一旦创建，其职责和身份就保持绑定，不得回收或替换。未分配独立 verifier 或辅助职责时，安全情况下可使用当前或已分配 Agent，否则报告不可用；不得通过改名将同一 Session 的工作冒充独立验证。
        - section-02:
            kind: section
            title: "Context Bootstrap/Refresh 分配"
            expose: true
            blocks:
              - section-02-body:
                  kind: markdown
                  text: |-
                    仅当复用可能比设置成本更有利时分配 Context Bootstrap/Refresh：至少两个独立下游 Worker、广泛侦察加三个或更多路由策略模块，或来源集合大致超过 20k 字符 / 5k token-equivalents。单个小 Worker 或仅文档快速路径应跳过。这里的数值是路由启发式，不是运行时或质量测量结论。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              父级以当前对话记录预留职责与名额，实际子任务完成后回写证据，不把扩展配置名当作职责。一次性执行不会自动释放已绑定名额。只有获准独立会话的验证才可标记独立，普通同上下文检查如实分类。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blank_lines_before: 2
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Child Creation](delegation-child-creation.yaml) — 定位子 Agent 创建归属。
              - [Coding Child Role Selection](child-role-selection.yaml) — 定位职责预留之前的选择判断。
              - [Coding Child Dispatch](delegation-child-dispatch.yaml) — 定位实际派发边界。
              - [Coding Child Lifecycle](delegation-child-lifecycle.yaml) — 定位子 Agent 状态归属。
              - [Coding Child Reuse and Replacement](delegation-child-reuse-replacement.yaml) — 定位获准的复用和替换。
              - [Coding Context Exchange](../context-exchange/context-exchange.yaml) — 定位上下文传输归属。
