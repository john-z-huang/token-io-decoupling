# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: fundamental-concept
id: delegation-mode-confirmation
markdown_path: references/coding/layer-01-fundamental-concepts/delegation/delegation-mode-confirmation.md
title: "Coding 委派模式确认"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档负责会话首次的模式选择、默认值、选择前限制以及单代理路线限制。它消费并更新状态记录；不定义数量锁定、重新进入、子 Agent 创建或生命周期。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - mode-selection:
            kind: section
            title: "会话模式选择"
            expose: true
            blocks:
              - mode-selection-body:
                  kind: markdown
                  text: |-
                    宿主识别的 Session 生命周期中，第一次 Coding 指令到达后，根父级必须：

                    1. 直接遵循指令中明确给出的有效模式/数量选择，不再询问。
                    2. 当前 Session 尚无有效选择时，呈现以下编号菜单并等待答复。用户明确选择使用缺省值或表示无偏好时，采用所示缺省值。
                       1. Multi-Agent Coding，1 个子代理（推荐且缺省）。
                       2. Single-Agent Coding，0 个子代理。
                       3. Multi-Agent Coding，自定义正整数子代理数（通过自由文本填写整数）。
                       4. 自定义指令（通过自由文本填写完整指令，并映射到受维护的模式和有效数量）。
                    3. 选项 3 必须提供明确正整数。若缺失或无效，只提出一个聚焦的补充问题，并保持 Mode gate 未放行；不得替换为 1。选项 4 的文本只用于推导受维护的 Single-Agent 或 Multi-Agent 路线及有效数量，同时记录其他任务约束。若文本缺失、无效、有歧义、冲突或要求未维护的路线，提出一个聚焦澄清并保持门禁未放行。自定义文本不得覆盖更高优先级的权限、安全、仓库、用户授权或能力边界，也不能创建路线或能力。
                    4. 将有效用户选择记录为 `mode_source: explicit`。将用户接受的缺省选择记录为 `mode_source: default`、`mode: Multi-Agent Coding`、`child_count: 1`。路线放行前应用数量 owner。模式在完整宿主 Session 生命周期内固定，而非只对一次用户/助手交互生效。后续指令、compact 和同一 Session 的恢复均沿用它。初始数量也保持固定，唯一例外是数量门禁在用户实际明确批准为不同且未占用职责增加一个名额后，恰好增加一。该流程不重新打开模式选择。具有新 Session 身份的 Fork 必须按 Re-entry owner 重新完成模式/数量选择，不继承来源 Session 的选择。
                    5. 将已放行的 Multi-Agent 数量视为仅预留容量。展示菜单、选择模式或锁定数量均不会创建或初始化子代理；创建仍受职责、输出类型和已放行切片门禁约束。

                    默认值只选择工作模式和预留数量，不绕过任务级禁止事项，也不创造能力。更高优先级规则禁止子代理时，必须遵循该规则。缺少所需记录能力时，阻塞依赖路线，不得假装记录存在。

                    创建子代理须满足数量、相关职责和具体切片放行条件。Primary Output 的任务限于代码/配置实现或本 Skill 指令/参考文档的编写编辑，其他职责按各自任务与权限核验。普通非 Skill 文档由根父级编写，即使任务同时包含代码修改也一样。如果本次会话已经锁定为单代理 Coding，遇到冲突的后续指令时先遵循模式重新进入 owner。
        - section-01:
            kind: section
            title: "单代理 Coding"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    确认后所有工作保留在当前 Session。不得创建、fork、handoff、消息联系、替换或管理子 Agent 或额外 Session。结构收益、验证、文档/Git、bootstrap、恢复或运行便利都不是例外。独立验证仍是语义要求，但该路线不可用。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              Root 按指令先确认模式/预算，再收集审计偏好。尚无有效选择时用上面的四项文字菜单；有效显式答案不重问。答案未齐、取消或无效时保持未放行；无 UI 时须显式提供缺项，否则阻断依赖工作。已锁定模式只在新 Session 中重新选择。模式选择与实际创建分别核验。
