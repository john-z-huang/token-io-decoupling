schema_version: 1
document_type: fundamental-concept
id: delegation-mode-reentry
markdown_path: references/coding/layer-01-fundamental-concepts/delegation/delegation-mode-reentry.md
title: "Coding 委派重新进入"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档负责重新进入模式和数量门禁，以及更高优先级限制或能力不可用时的阻断边界。它消费模式确认和数量门禁的结果；不重复其确认或数量锁定策略，也不定义子 Agent 创建或生命周期。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - section-01:
            kind: section
            title: "门禁重新进入"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    同一宿主 Session 生命周期内的后续根指令沿用已锁定的模式和当前子代理数量预算；不重新打开模式选择，也不替换会话选择。后续轮次、compact 或同一 Session 的恢复均不会重置这些门禁。唯一允许的同 Session 数量变化，是按[委派数量门禁](delegation-mode-count-gate.yaml)，在用户实际明确批准为不同且未占用职责增加一个名额后，恰好增加一个名额。该事务只改变数量；不重新选择模式、不放行 Slice，也不创建子代理。其他数量或拓扑变更请求都会阻塞依赖工作，直到开启新 Session。按需更新任务专属 Contract、切片、allocation 的当前生命周期和能力证据。

                    Fork 会以新的 Session 身份开启新会话。在任何依赖工作前，必须重新确认模式、选择数量并初始化状态记录，即使来源会话曾使用 Single-Agent 模式也一样。继承的子代理身份属于其他会话：不得将其采纳为已创建、已预留、可恢复或当前会话的合格候选。新记录只能依据本会话当前用户指令和状态构建；不得把来源会话已锁定的模式/数量选择冒充为本会话的新选择。
        - section-02:
            kind: section
            title: "更高优先级限制和能力阻断"
            expose: true
            blocks:
              - section-02-body:
                  kind: markdown
                  text: |-
                    用户、权限、安全、产品、运行环境、能力、仓库和安全限制始终有效。能力不可用时阻塞路线，不能据此默默改变模式或数量。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              区分当前会话的 compact/恢复和真正新根会话。只依据真实宿主事件和当前记录，不从文件名猜测身份。分支、树导航和扩展任务均不自动继承可操作子代理；缺少当前状态时先恢复证据再继续。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blank_lines_before: 2
      blocks:
        - related-body:
            kind: markdown
            text: |-
