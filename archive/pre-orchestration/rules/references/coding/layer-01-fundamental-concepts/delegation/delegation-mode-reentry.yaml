              - [Coding Delegation Count Gate](delegation-mode-count-gate.yaml) — 定位数量锁定归属。
              - [Coding Delegation State Record](delegation-state-record.yaml) — 定位状态记录归属。
              - [Coding Session Model](../session-runtime/session-model.yaml) — 定位 Session 身份和 Fork 边界。
              - [Coding Child Creation](delegation-child-creation.yaml) — 定位子 Agent 创建归属。
              - [Coding Child Lifecycle](delegation-child-lifecycle.yaml) — 定位子 Agent 生命周期归属。
