schema_version: 1
document_type: fundamental-concept
id: delegation-child-message-visibility
markdown_path: references/coding/layer-01-fundamental-concepts/delegation/delegation-child-message-visibility.md
title: "Coding 子代理消息可见性"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档仅规定父级会话与子代理之间文本消息的会话可见性和正文证据，不规定消息授权或消息内容范围。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - section-01:
            kind: section
            title: "按配置展示；依赖前取得完整正文"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    按[会话审计可见性](../session-runtime/session-audit-visibility.yaml)预设执行。Worker 必须在自身会话中完整展示安全的入站和出站正文。Root 消息按预设展示预览、摘要或全文；要求全文时，发送前须完整展示安全正文并确认与载荷完全一致。Worker 已完整可见的最终结果就是出站副本，不得重复打印。

                    收到消息后，Root 在依赖前必须取得并完整阅读实际返回正文；再按预设在主要会话中展示完整安全正文或摘要。工具调用卡片、活动事件、送达回执、任务状态或“消息已发送”等通知不等同于消息正文，不能代替正文。

                    按职责或预设要求完整展示时，过长正文可拆分为连续编号的部分展示，不得概述或截断；如需遮蔽内容，应明确标记。若运行环境未显示实际正文，且无法从会话记录复现，则不得将该消息用于依赖工作。
        - section-02:
            kind: section
            title: "保留方向与证据"
            expose: true
            blocks:
              - section-02-body:
                  kind: markdown
                  text: |-
                    注明每条消息的方向；运行环境提供身份时，同时注明目标或来源子代理。将正文与评论清楚区分。转述、摘要或声称内容已发送/收到，均不能作为消息正文的证据。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              以实际扩展输入和返回正文作为消息证据。当前界面未展示 Worker 会话记录时，日志可见性记为 unverified 或有证据的 unavailable；最终返回可用不代表内部日志可用。依赖前读取完整正文；截断时取得剩余部分，不能将摘要冒充全文。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blank_lines_before: 2
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Child Creation](delegation-child-creation.yaml) — 定位新子代理提示的创建边界。
              - [Coding Child Dispatch](delegation-child-dispatch.yaml) — 定位已放行切片和后续派发要求。
              - [Coding Child Lifecycle](delegation-child-lifecycle.yaml) — 定位子代理状态及返回处理。
              - [Coding Session 审计可见性](../session-runtime/session-audit-visibility.yaml) — 定位会话可见性预设及优先级。
