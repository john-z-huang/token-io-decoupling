schema_version: 1
document_type: fundamental-concept
id: execution-control
markdown_path: references/coding/layer-01-fundamental-concepts/execution-control/execution-control.md
title: "Coding Execution Control"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本文档负责 Interaction Slice 控制：slice 放行字段、边界行为和 Control Checkpoint 选择。它假定规划、决策门禁、阶段反馈、角色/Session 上下文、运行环境能力、上下文传输和委派生命周期由各自 owner 概念提供，不定义这些策略。
  - rules:
      kind: section
      title: "通用规范"
      expose: true
      blocks:
        - interaction-slice:
            kind: section
            title: "Interaction Slice"
            expose: true
            blocks:
              - interaction-slice-body:
                  kind: markdown
                  text: |-
                    对于非简单工作，每次只放行一个 **Interaction Slice**。每个 slice 必须写明：

                    - `Objective`：必须产出的结果；
                    - `Authorized scope/mutations`：允许的路径、行为和写入；
                    - `Return conditions`：结束 slice 的证据或里程碑；
                    - `Unreleased boundary`：仍被阻塞的下一个子系统、风险域、语义选择或变更。

                    Slice 是控制单元，不是逐命令脚本。只要 Contract 和边界未变，执行者可以继续处理低决策密度的机械步骤；到达 return conditions 或跨越未放行边界前必须暂停。简单的快路径任务可以将实现和聚焦检查保留在一个 slice 中。
        - section-01:
            kind: section
            title: "Slice 顺序"
            expose: true
            blocks:
              - section-01-body:
                  kind: markdown
                  text: |-
                    只有相互独立且不冲突的 slice 才可并行放行。存在依赖、共享写入目标或有序结果时必须顺序放行。上下文传输和仅限父级的反馈遵循各自 owner 协议，本文档不定义这些内容。
        - control-checkpoint:
            kind: section
            title: "Control Checkpoint"
            expose: true
            blocks:
              - control-checkpoint-body:
                  kind: markdown
                  text: |-
                    到达实质性边界时，消费[执行阶段反馈](execution-stage-feedback.yaml)定义的 Progress Signal，附加当前 `Unreleased boundary`，再选择一个最终控制结果：`Continue`、`Amend` 或 `Stop`。Control 聚焦实质偏离、新证据或真实边界；不要把已放行 slice 变成逐命令审批，也不要重复无变化状态。`Continue` 只放行下一个有界 Slice；`Amend` 必须先修改 Contract 或边界再恢复执行。`Evidence-on-Demand` 是暂停放行并请求证据的中间动作，取得证据后重新经过本检查点；它不是第四种最终授权结果。单代理路线中这是内部推理暂停，不模拟发给自己的消息。
  - runtime-guidance:
      kind: section
      title: "运行时指引"
      expose: true
      blocks:
        - runtime-guidance-body:
            kind: markdown
            text: |-
              按所选宿主适配核对真实规划、委派与持久消息能力。按通用 Slice、阶段反馈及授权边界执行；使用当前实际可用的工具结果作为证据，不以 Hook 或宿主特性替代语义判断。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Execution Planning](../execution-planning/execution-planning.yaml) — 定位有界规划和 reconnaissance 到实现放行的关系。
              - [Coding Execution Decision Gate](../execution-planning/execution-decision-gate.yaml) — 定位 Decision Brief 和决策放行规则。
              - [Coding Execution Stage Feedback](execution-stage-feedback.yaml) — 定位有界阶段反馈规则。
              - [Coding Context Exchange](../context-exchange/context-exchange.yaml) — 定位上下文传输归属。
              - [Coding 子 Agent 生命周期](../delegation/delegation-child-lifecycle.yaml) — 定位已放行 slice 的委派生命周期归属。
              - [Coding Session 审计可见性](../session-runtime/session-audit-visibility.yaml) — 定位审计配置和摘要频率。
