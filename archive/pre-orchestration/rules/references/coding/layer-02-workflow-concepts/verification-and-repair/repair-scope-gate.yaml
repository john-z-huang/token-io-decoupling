# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: workflow-concept
id: repair-scope-gate
markdown_path: references/coding/layer-02-workflow-concepts/verification-and-repair/repair-scope-gate.md
title: "修复范围门禁"
blocks:
  - overview:
      kind: markdown
      title: "概览"
      expose: true
      text: |-
        本检查点负责候选修复的兼容性和授权门禁。它消费已诊断的修复候选；不诊断失败、不执行修复，也不定义验证 epoch。
  - section-01:
      kind: section
      title: "Contract 和决策兼容性"
      expose: true
      blocks:
        - section-01-body:
            kind: markdown
            text: |-
              1. 确认候选修复仍在已批准的 Contract 和决策内。
              2. 如果它改变范围、架构、安全、兼容性或其他实质性决策，则暂停，并在授权执行前返回 Contract 和决策检查点。
  - pass:
      kind: section
      title: "通过条件"
      expose: true
      blocks:
        - pass-body:
            kind: markdown
            text: |-
              候选修复已在批准范围内获得明确授权，或已在执行前明确需要的 Contract、决策或能力。
  - boundary:
      kind: section
      title: "边界"
      expose: true
      blocks:
        - boundary-body:
            kind: markdown
            text: |-
              本检查点不诊断失败证据，不选择修复内容，不执行修复，不运行聚焦检查，也不创建验证 epoch。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Execution Decision Gate](../../layer-01-fundamental-concepts/execution-planning/execution-decision-gate.yaml) — 定位实质性决策和放行条件归属。
              - [Coding Execution Control](../../layer-01-fundamental-concepts/execution-control/execution-control.yaml) — 定位批准范围和修改边界。
              - [Coding Delegation State Record Worker Boundary](../../layer-01-fundamental-concepts/delegation/delegation-worker-boundary.yaml) — 定位父级控制的授权边界。
