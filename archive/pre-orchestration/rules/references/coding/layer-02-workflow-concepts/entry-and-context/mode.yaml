# yaml-language-server: $schema=../../../../reference.schema.json
schema_version: 1
document_type: workflow-concept
id: mode
markdown_path: references/coding/layer-02-workflow-concepts/entry-and-context/mode.md
title: "执行模式检查点"
blocks:
  - actions:
      kind: section
      title: "动作"
      expose: true
      blank_lines_before: 2
      blocks:
        - actions-body:
            kind: markdown
            text: |-
              1. 加载[状态记录](../../layer-01-fundamental-concepts/delegation/delegation-state-record.yaml)、[模式确认](../../layer-01-fundamental-concepts/delegation/delegation-mode-confirmation.yaml)、[数量门禁](../../layer-01-fundamental-concepts/delegation/delegation-mode-count-gate.yaml)和[重新进入](../../layer-01-fundamental-concepts/delegation/delegation-mode-reentry.yaml) owner。不得在实际执行步骤前预先加载子代理创建、派发、生命周期或复用的完整策略。
              2. 核对父级记录：Single-Agent 使用 `child_count: 0`、`allocations: []`；Multi-Agent 数量已锁定，已占用名额不超过预算，按状态记录 owner 核实容量表达和现有分配。若有初始 `mode_source: default` 记录，核实其为 Multi-Agent、预算 1。如果 `mode_source: timeout-default`，仅为兼容旧记录而接受，并核实 Single-Agent、`child_count: 0` 和 `allocations: []`；新会话不再使用此来源。本门禁放行**不**等于具体 Interaction Slice 已放行，也不授权创建子代理。
              3. 后续指令沿用已锁定 mode/count，只更新任务专属证据，不重新打开模式/数量门禁。记录或必需能力证据缺失时阻塞依赖路线。职责分配和子代理操作在路线指定的执行阶段核验。

              4. 核验已记录获授权的模式/数量及本门禁所需证据。建议输出不能改变已锁定模式/数量或重开本门禁；建议政策遵循[Decisions 建议](../../layer-01-fundamental-concepts/execution-planning/decisions-advisory.yaml)。
  - pass:
      kind: section
      title: "通过条件"
      expose: true
      blocks:
        - pass-body:
            kind: markdown
            text: |-
              父级记录具有唯一有效的已放行模式、固定数量及适用时有效的预留 allocation 结构，并满足路线入口能力；不得推断已有具体子代理或 Slice 获准。
  - boundary:
      kind: section
      title: "边界"
      expose: true
      blocks:
        - boundary-body:
            kind: markdown
            text: |-
              本检查点负责组合并验证状态记录、模式/数量和按条件加载的子代理派发/生命周期 reference，不独立决定模式、拓扑、创建、分配、复用、例外、生命周期或数量。父级控制任务记录保存在其规范对话上下文中，并按其 owner 回读。
  - related:
      kind: section
      title: "相关概念"
      expose: true
      blocks:
        - related-body:
            kind: markdown
            text: |-
              - [Coding Delegation Mode Confirmation](../../layer-01-fundamental-concepts/delegation/delegation-mode-confirmation.yaml) — 定位根模式确认归属。
              - [Coding Delegation Count Gate](../../layer-01-fundamental-concepts/delegation/delegation-mode-count-gate.yaml) — 定位子 Agent 数量门禁归属。
              - [Coding Delegation Re-entry](../../layer-01-fundamental-concepts/delegation/delegation-mode-reentry.yaml) — 定位模式/数量重新进入归属。
              - [Coding Delegation State Record](../../layer-01-fundamental-concepts/delegation/delegation-state-record.yaml) — 定位任务控制记录归属。
              - [Coding Delegation State Record Worker Boundary](../../layer-01-fundamental-concepts/delegation/delegation-worker-boundary.yaml) — 定位已放行 Worker 记录访问边界。
