[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling-tools"
version = "0.1.0"
description = "Bounded Token I/O utility and output materialization library"
requires-python = ">=3.11"
dependencies = ['token-io-decoupling-core==0.1.0', 'token-io-decoupling-transport==0.1.0', 'httpx2>=2.16,<3', 'openai>=3.37,<4', 'pydantic>=2.12,<3']

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling_tools"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**"]
