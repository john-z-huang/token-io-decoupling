[build-system]
requires = ["hatchling>=1.27,<2", "jsonschema==4.26.0", "ruamel.yaml==0.19.1"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling"
version = "0.1.0"
description = "Pi Coding Agent 通用工具 MCP Server 与 Skill 管理"
requires-python = ">=3.11"
dependencies = [
  "dev-workflow-standards-tools @ git+https://github.com/john-z-huang/dev-workflow-standards.git@ba5ecc95d9f9da77aca22c17e712d6c8d2a05987#subdirectory=mcp-server",
  "token-io-decoupling-core==0.1.0",
  "token-io-decoupling-transport==0.1.0",
  "token-io-decoupling-tools==0.1.0",
]

[project.scripts]
token-io-decoupling-tools = "token_io_decoupling.cli:tools_main"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["hatchling>=1.27,<2", "jsonschema==4.26.0", "ruamel.yaml==0.19.1", "pytest>=8,<9", "ruff>=0.14,<1", "ty>=0.0.1a0"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**", "/tests/**", "/hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/mock_api_tests", "tests/real_api_tests"]
addopts = "-ra"
markers = [
  "real_api: opt-in live OpenAI API integration tests",
  "real_client: opt-in installed Codex CLI and ChatGPT Desktop Codex runtime integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "packages", "tests"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
token-io-decoupling-core = { workspace = true }
token-io-decoupling-transport = { workspace = true }
token-io-decoupling-tools = { workspace = true }
