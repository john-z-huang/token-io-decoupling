[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling-hooks"
version = "0.1.0"
description = "Codex 原生 Hook 入口与配置注册"
requires-python = ">=3.11"
dependencies = ["token-io-decoupling-workflow==0.1.0"]

[project.scripts]
token-io-decoupling-hooks = "token_io_decoupling_hooks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling_hooks"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**"]

[tool.uv.sources]
token-io-decoupling-workflow = { workspace = true }
