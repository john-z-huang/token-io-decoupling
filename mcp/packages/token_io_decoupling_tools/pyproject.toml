[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling-tools"
version = "0.1.0"
description = "Independent development, task-plan and Memory MCP tools"
requires-python = ">=3.11"
dependencies = [
  "token-io-decoupling-core==0.1.0",
  "token-io-decoupling-transport==0.1.0",
  "dev-workflow-standards-tools @ git+https://github.com/john-z-huang/dev-workflow-standards.git@ba5ecc95d9f9da77aca22c17e712d6c8d2a05987#subdirectory=mcp-server",
  "httpx2>=2.16,<3",
  "openai>=3.37,<4",
]

[project.scripts]
token-io-decoupling-tools = "token_io_decoupling_tools.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling_tools"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**"]
