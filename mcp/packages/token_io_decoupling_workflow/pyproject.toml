[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling-workflow"
version = "0.1.0"
description = "Token I/O workflow library"
requires-python = ">=3.11"
dependencies = ['token-io-decoupling-core==0.1.0', 'token-io-decoupling-transport==0.1.0', 'httpx2>=2.16,<3', 'openai>=3.37,<4', 'pydantic>=2.12,<3']

[project.scripts]
token-io-decoupling-workflow = "token_io_decoupling_workflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling_workflow"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/hatch_build.py", "/src/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
