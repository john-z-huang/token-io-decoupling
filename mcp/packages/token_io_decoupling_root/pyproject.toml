[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling-root-agent-tools"
version = "0.1.0"
description = "Token I/O root-tools library"
requires-python = ">=3.11"
dependencies = ['token-io-decoupling-core==0.1.0', 'token-io-decoupling-state==0.1.0', 'token-io-decoupling-transport==0.1.0']

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling_root"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**"]
