[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling"
version = "0.1.0"
description = "Unified launcher for the Token I/O MCP role profiles"
requires-python = ">=3.11"
dependencies = [
  "token-io-decoupling-core==0.1.0",
  "token-io-decoupling-state==0.1.0",
  "token-io-decoupling-transport==0.1.0",
  "token-io-decoupling-workflow==0.1.0",
  "token-io-decoupling-root-agent-tools==0.1.0",
  "token-io-decoupling-worker-agent-tools==0.1.0",
  "token-io-decoupling-share-tools==0.1.0",
  "tomlkit>=0.15,<1",
]

[project.scripts]
token-io-decoupling = "token_io_decoupling.cli:main"

[dependency-groups]
dev = ["hatchling>=1.27,<2", "pytest>=8,<9", "ruff>=0.14,<1", "ty>=0.0.1a0"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling", "src/token_io_decoupling_mcp"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/**", "/tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests", "tests/mock_api_tests", "tests/real_api_tests"]
addopts = "-ra"
markers = ["real_api: opt-in live OpenAI API integration tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src", "packages", "tests"]

# These released migration sources retain a historical import whose runtime
# alias is provided only while the state loader imports them. Keep them
# byte-for-byte unchanged because their source checksums are recorded in DB history.
[[tool.ty.overrides]]
include = ["packages/token_io_decoupling_state/src/token_io_decoupling_state/migrations/worker/v0001_initial.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["packages/token_io_decoupling_state/src/token_io_decoupling_state/migrations/workflow/v0001_initial.py"]

[tool.ty.overrides.rules]
unresolved-import = "ignore"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
token-io-decoupling-core = { workspace = true }
token-io-decoupling-state = { workspace = true }
token-io-decoupling-transport = { workspace = true }
token-io-decoupling-workflow = { workspace = true }
token-io-decoupling-root-agent-tools = { workspace = true }
token-io-decoupling-worker-agent-tools = { workspace = true }
token-io-decoupling-share-tools = { workspace = true }
