[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "token-io-decoupling"
version = "0.1.0"
description = "Local workflow and tools MCP servers"
requires-python = ">=3.11"
dependencies = [
  "dev-workflow-standards-tools @ git+https://github.com/john-z-huang/dev-workflow-standards.git@ba5ecc95d9f9da77aca22c17e712d6c8d2a05987#subdirectory=mcp-server",
  "token-io-decoupling-core==0.1.0",
  "token-io-decoupling-transport==0.1.0",
  "token-io-decoupling-workflow==0.1.0",
  "tomlkit>=0.15,<1",
]

[project.scripts]
token-io-decoupling = "token_io_decoupling.cli:main"
token-io-decoupling-workflow = "token_io_decoupling.cli:workflow_main"
token-io-decoupling-tools = "token_io_decoupling.cli:tools_main"

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
codex-test = [
    "openai-codex==0.163.0",
]
dev = ["hatchling>=1.27,<2", "pytest>=8,<9", "ruff>=0.14,<1", "ty>=0.0.1a0"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_io_decoupling"]

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/src/token_io_decoupling/**", "/hatch_build.py"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["../.agents/skills/token-io-decoupling-dev/tests/mcp/unit_tests", "../.agents/skills/token-io-decoupling-dev/tests/mcp/mock_api_tests", "../.agents/skills/token-io-decoupling-dev/tests/mcp/real_api_tests"]
pythonpath = ["src", "packages/token_io_decoupling_core/src", "packages/token_io_decoupling_transport/src", "packages/token_io_decoupling_workflow/src", "../.agents/skills/token-io-decoupling-dev/tests/mcp"]
addopts = "-ra"
markers = [
  "real_api: opt-in live OpenAI API integration tests",
  "real_client: opt-in installed Codex CLI and ChatGPT Desktop Codex runtime integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["token_io_decoupling", "token_io_decoupling_core", "token_io_decoupling_transport", "token_io_decoupling_workflow"]
known-third-party = ["mcp"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["../.agents/skills/token-io-decoupling-dev/tests/mcp", "../.agents/skills/token-io-decoupling-dev/tests/mcp/support"]

[tool.ty.src]
include = ["src", "packages"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
token-io-decoupling-core = { workspace = true }
token-io-decoupling-transport = { workspace = true }
token-io-decoupling-workflow = { workspace = true }
