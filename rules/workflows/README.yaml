# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: directory-guide
id: coding-workflow-directory
markdown_path: workflows/README.md
title: Coding 路线目录
blocks:
  - overview:
      kind: markdown
      title: 概览
      expose: true
      text: |-
        两条路线共用需求确认、任务规划、结果验证和交付。执行阶段按模式使用主代理执行或委派合同。
  - entry:
      kind: section
      title: 入口
      expose: true
      blocks:
        - entry-body:
            kind: markdown
            text: |-
              依据[路线选择器](coding.yaml)的当前任务判断进入对应路线。
  - routes:
      kind: section
      title: 路线
      expose: true
      blocks:
        - routes-body:
            kind: markdown
            text: |-
              - [单代理 Coding](coding-single-agent.yaml)
              - [多代理 Coding](coding-multi-agent.yaml)
  - section-01:
      kind: section
      title: 阶段进入与退出
      expose: true
      blocks:
        - section-01-body:
            kind: markdown
            text: |-
              主代理在接收新指令、任务回执或验证结果时，根据当前任务与依赖决定下一步。两条路线共用以下条件。

              每张图以「开始」汇集适用入口，以「结束」收束当前一轮的结果。暂停、转交或关闭当前分支之后，满足相应触发条件时从「开始」进入新一轮核验。

              1. **进入或重进**。按[Hook 触发目录](../hooks/README.yaml)识别当前适用的合同，核实目标阶段的输入、证据及执行条件，确认下一步仍在授权范围内。缺少必要前置时，回到能补齐它的阶段。条件不明或受阻时，只暂停依赖该条件的工作，继续推进相互独立且已获准的工作。
              2. **退出或跳转**。核对当前阶段适用 Hook 的「退出与阻断」，再核对目标阶段的进入条件。跨阶段时，被略过的阶段须有仍适用的退出证据，或依据当前任务约定确认该阶段无适用工作。在当前任务上下文中记录跳转依据和待补证项。缺失、过期或未知的必要证据须先补齐。受阻时可按[交付 Hook](../hooks/delivery.yaml)报告，只有必要验收通过才结束为完成。
              3. **回退或恢复**。按各路线的变更场景回到受影响阶段，应用相关 Hook 的「重新核验」。记录变化、受影响的下游工作和仍有效的产物与证据。修复或恢复后按当前事实决定落点，沿用有效证据，只重做受影响部分。
        - hook-flowcharts:
            kind: section
            title: Hook 子流程图
            expose: true
            blocks:
              - entry-flowchart:
                  kind: section
                  title: 入口 Hook 的子流程
                  blocks:
                    - entry-diagram:
                        kind: markdown
                        text: |-
                          边界确认后进入选路和任务规划。新约束影响在途工作时，同时进入恢复子流程。[入口合同](../hooks/entry.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["新任务、补充指令或分工约束及能力变化"]
                              INPUTS["取得真实指令、工作状态、代理限制和宿主能力"]
                              SOURCES["按需查选路规则及委派能力"]
                              EXECUTION["核对任务约定和当前事实"]
                              EXECUTION_1["确认目标、交付、验收和授权，保留仍适用的要求"]
                              EXECUTION_2["确认代理限制，按限制和分工价值选路"]
                              EXECUTION_3["标明已知、未知和待核实项，推进无关的获准工作"]
                              OUTPUTS["交出目标、边界、验收条件和补证事项"]
                              EXIT{"边界足以选路和规划？"}
                              READY["按适用路线进入任务规划"]
                              PAUSE["暂停依赖冲突约束或未明授权的工作"]
                              RECHECK["任务、范围、验收或代理限制改变时重查受影响事实"]
                              END(["结束"])
                              START -->|收到任务或需确认指令| TRIGGER
                              START -. 已确认的任务边界变化或补齐证据 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 --> EXECUTION_2
                              EXECUTION_2 --> EXECUTION_3
                              EXECUTION_3 --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|冲突或授权不清| PAUSE
                              RECHECK --> INPUTS
                              READY --> END
                              PAUSE --> END
                          ```
              - planning-flowchart:
                  kind: section
                  title: 规划 Hook 的子流程
                  blocks:
                    - planning-diagram:
                        kind: markdown
                        text: |-
                          规划时逐项考虑同页所有 Hook 子项。对适用项明确所需证据、负责人和阻断后的落点，对条件项记触发条件，对当前不适用或事实待核实的项记录原因或缺口。用户目标、授权或验收改变后，回入口重核任务约定。[规划合同](../hooks/planning.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["选路后规划，或任务边界、依赖、角色、验收变化"]
                              INPUTS["读取当前目标、约束、验收、状态和适用的角色及能力"]
                              SOURCES["查任务规划、依赖与交接规则及角色匹配"]
                              EXECUTION["逐项规划工作和依赖"]
                              EXECUTION_1["拆解任务，写明前置输入、执行者、影响范围和返回证据"]
                              EXECUTION_2["确定分工和交接，核对决策与执行是否就绪"]
                              EXECUTION_3["按新证据更新分工、顺序和验收，保留有效产物与派发记录"]
                              HOOKS["逐项核对各 Hook 的适用性、触发条件、证据缺口和返回位置"]
                              OUTPUTS["记录任务、依赖、职责、交付、验收办法及 Hook 触发和落点"]
                              EXIT{"近期工作、职责和验收办法明确？"}
                              READY["进入执行、符合条件的委派或已有产物复核"]
                              PAUSE["补齐缺失前置，暂停依赖该前置的工作"]
                              ENTRY["回入口重核任务约定"]
                              RECHECK["依赖、资源、要求、角色或下游所需结果变化时只重查受影响项"]
                              END(["结束"])
                              START -->|当前任务需要规划| TRIGGER
                              START -. 计划前提变化或取得新证据 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS -->|任务边界未确认| ENTRY
                              INPUTS -->|任务边界已确认| SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 --> EXECUTION_2
                              EXECUTION_2 -->|已有计划需调整| EXECUTION_3
                              EXECUTION_2 -->|已有可执行安排| HOOKS
                              EXECUTION_3 -->|任务约定变化| ENTRY
                              EXECUTION_3 -->|确认计划仍在当前授权内| HOOKS
                              HOOKS --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|缺必要条件| PAUSE
                              RECHECK --> INPUTS
                              READY --> END
                              PAUSE --> END
                              ENTRY --> END
                          ```
              - execution-flowchart:
                  kind: section
                  title: 主代理执行 Hook 的子流程
                  blocks:
                    - execution-diagram:
                        kind: markdown
                        text: |-
                          两条路线均可进入。多代理路线中主代理仍须遵守其命令执行边界。[主代理执行合同](../hooks/execution.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["主代理准备推进自己承担的工作"]
                              INPUTS["读取当前计划、可执行任务、允许路径及前置结果"]
                              SOURCES["按任务边界和依赖判断并行或串行"]
                              EXECUTION["按实际依赖执行工作项"]
                              EXECUTION_1{"依赖、授权、执行边界和结束条件已确认？"}
                              EXECUTION_2["执行并记录实际结果、失败和新证据，判断继续、调整或暂停"]
                              EXECUTION_3["依赖就绪后推进下一项，多代理时核对主代理命令边界"]
                              OUTPUTS["交出当前产物、操作证据或具体障碍"]
                              EXIT{"本项交付可验证且依赖满足？"}
                              READY["下游使用产物或进入验证"]
                              PAUSE["暂停本项，按原因补证、复核计划或进入恢复"]
                              RECHECK["输入、资源、授权或上游结果变化时重查其影响"]
                              END(["结束"])
                              START -->|推进已分配的工作| TRIGGER
                              START -. 检出影响或补齐前置 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 -->|是| EXECUTION_2
                              EXECUTION_1 -->|缺授权或前置| OUTPUTS
                              EXECUTION_2 --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|可验证| READY
                              EXIT -->|有就绪的下一项| EXECUTION_3
                              EXIT -->|缺证据或操作失败| PAUSE
                              EXECUTION_3 --> INPUTS
                              RECHECK --> INPUTS
                              READY --> END
                              PAUSE --> END
                          ```
              - delegation-flowchart:
                  kind: section
                  title: 委派 Hook 的子流程
                  blocks:
                    - delegation-diagram:
                        kind: markdown
                        text: |-
                          单代理路线在触发判断处继续主代理工作。只有重新选入多代理路线后，才按下图核对委派条件。[委派合同](../hooks/delegation.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER{"多代理路线有具体派发、续接、替换或实例变化？"}
                              SKIP["本项无委派，沿当前获准分工继续"]
                              INPUTS["读取计划、角色、实例状态、参数、能力和当前前置结果"]
                              SOURCES["查能力、角色匹配、复用、替换、交接和模型规则"]
                              EXECUTION["核对适用的委派条件和宿主能力"]
                              EXECUTION_1["匹配角色，核对职责、执行要求和回传证据"]
                              EXECUTION_2{"按真实实例、在途工作和派发记录判断复用或创建"}
                              EXECUTION_3["确需首次创建或获准替换时核实模型和强度，禁止 Ultra"]
                              EXECUTION_4["核对旧任务未决效果，交接必要材料，按回执和依赖整合结果"]
                              OUTPUTS["记录子任务、角色、实例、状态和证据，替换时记原因与剩余工作"]
                              EXIT{"回执可信且本项产物可供下游使用？"}
                              READY["主代理按依赖集成，将产物交还原阶段"]
                              WAIT["排队或等前置，结果不明时进入恢复"]
                              RECHECK["指令、任务、实例或模型与强度变化时重查相关条件"]
                              END(["结束"])
                              START -->|判断当前是否适用委派| TRIGGER
                              START -. 委派条件或相关证据变化 .-> RECHECK
                              TRIGGER -->|适用| INPUTS
                              TRIGGER -->|当前无获准委派| SKIP
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 --> EXECUTION_2
                              EXECUTION_2 -->|同角色实例可续接| EXECUTION_4
                              EXECUTION_2 -->|符合创建或替换条件| EXECUTION_3
                              EXECUTION_2 -->|排队或实例/前置不明| WAIT
                              EXECUTION_3 --> EXECUTION_4
                              EXECUTION_4 --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|仍有依赖或未决效果| WAIT
                              RECHECK --> TRIGGER
                              READY --> END
                              WAIT --> END
                              SKIP --> END
                          ```
              - verification-flowchart:
                  kind: section
                  title: 验证 Hook 的子流程
                  blocks:
                    - verification-diagram:
                        kind: markdown
                        text: |-
                          本图适用于单项结果、汇总验收及修复复验。多代理按需委派独立验证，主代理核对返回证据。单代理缺少所需独立性时记录阻断。[验证合同](../hooks/verification.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["接收结果、汇总、需独立验证或修复完成"]
                              INPUTS["输入验收条件、当前产物、执行证据和检查方法"]
                              SOURCES["按需查独立验证角色和派发结果交接规则"]
                              EXECUTION["按实际风险和变化核对验收"]
                              EXECUTION_1["选检查并逐项核对要求、当前产物、证据时效和结果"]
                              EXECUTION_2["需要独立验证时核实执行者及证据，多代理可按委派合同派发"]
                              EXECUTION_3["缺陷先核对修复范围，并逐项记录通过、失败、跳过和受阻"]
                              OUTPUTS["交出验收与证据对应关系、失败原因、缺项及影响"]
                              EXIT{"必要验收均有当前证据，且所需独立性满足？"}
                              READY["通过的结果供下游使用，最终验收通过后进入交付"]
                              REPAIR["原范围内返回执行或委派，范围改变先回入口或规划"]
                              PAUSE["缺证据或独立性时补齐条件，无法补齐则报告受阻"]
                              RECHECK["产物、依赖、验收变化或修复完成后按交接仅复核受影响项目"]
                              END(["结束"])
                              START -->|接收结果或汇总验收| TRIGGER
                              START -. 修复完成或验收证据变化 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 -->|要求独立验证| EXECUTION_2
                              EXECUTION_1 -->|无独立性要求| EXECUTION_3
                              EXECUTION_2 --> EXECUTION_3
                              EXECUTION_3 --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|存在缺陷| REPAIR
                              EXIT -->|证据过期、不足或独立性缺失| PAUSE
                              RECHECK --> INPUTS
                              READY --> END
                              REPAIR --> END
                              PAUSE --> END
                          ```
              - recovery-flowchart:
                  kind: section
                  title: 恢复 Hook 的子流程
                  blocks:
                    - recovery-diagram:
                        kind: markdown
                        text: |-
                          在任意阶段按受影响工作项触发。恢复后重查目标阶段的进入条件。[恢复合同](../hooks/recovery.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["中断、调用失败、状态异常、效果未知或新约束影响在途工作"]
                              INPUTS["读取最后可信状态、任务、真实回执、可能受影响的产物和依赖"]
                              SOURCES["按需查同角色复用、交接及计划调整规则"]
                              EXECUTION["按真实效果确定可恢复的范围"]
                              EXECUTION_1{"核实状态和已发生的效果，再判断可否恢复"}
                              EXECUTION_2["核对修复边界，优先续接原执行者，查异常实例状态和可续接性"]
                              EXECUTION_3["停止旧派发，按宿主能力暂停或取消受影响任务，未知效果记为未决"]
                              EXECUTION_4["推进独立获准工作，必要时更新依赖或执行者，约束变化回入口"]
                              OUTPUTS["交出可信恢复位置、有效产物、剩余工作和未决事项"]
                              EXIT{"已证明受影响工作可以安全续接？"}
                              READY["返回原位置或调整后已就绪的阶段"]
                              PAUSE["暂停相关工作，报告具体阻断和所需条件"]
                              RECHECK["状态变化、迟到回执或新事实出现时重查影响"]
                              END(["结束"])
                              START -->|收到恢复事件| TRIGGER
                              START -. 迟到回执或新事实影响已知效果 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 -->|在途任务因新约束失效| EXECUTION_3
                              EXECUTION_1 -->|确认可恢复| EXECUTION_2
                              EXECUTION_1 -->|效果不明，停止重放| EXECUTION_4
                              EXECUTION_2 --> EXECUTION_4
                              EXECUTION_3 --> EXECUTION_4
                              EXECUTION_4 --> OUTPUTS
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|仍缺条件| PAUSE
                              RECHECK --> INPUTS
                              READY --> END
                              PAUSE --> END
                          ```
              - delivery-flowchart:
                  kind: section
                  title: 交付 Hook 的子流程
                  blocks:
                    - delivery-diagram:
                        kind: markdown
                        text: |-
                          报告受阻也走交付子流程。完成取决于必要验收和当前证据。[交付合同](../hooks/delivery.yaml)

                          ```mermaid
                          flowchart TD
                              START(["开始"])
                              TRIGGER["准备结束任务、交付或报告受阻"]
                              INPUTS["读取用户指令、验收、实际产物、验证和适用的委派结果"]
                              SOURCES["查主代理验收和交付证据责任"]
                              EXECUTION["核对交付的实际结果与证据"]
                              EXECUTION_1["确认产物可用性，列实际产物、检查和影响验收的缺项"]
                              EXECUTION_2["将实际效果与证据对应，超范围操作另按当前授权判断"]
                              EXECUTION_3["输入或结果变化时回受影响的需求、任务或验证项并更新交付状态"]
                              OUTPUTS["给出结果、验证状态和产物链接，或阻断与恢复条件"]
                              EXIT{"必要交付物已通过适用验收？"}
                              READY["完成任务"]
                              PAUSE["报告受阻及缺少的条件"]
                              RECHECK["交付物、验收要求或验证状态变化时重查受影响项"]
                              RETURN["返回对应阶段，取得最新证据再进入交付"]
                              END(["结束"])
                              START -->|准备交付或报告受阻| TRIGGER
                              START -. 交付或验收条件变化 .-> RECHECK
                              TRIGGER --> INPUTS
                              INPUTS --> SOURCES
                              SOURCES --> EXECUTION
                              EXECUTION --> EXECUTION_1
                              EXECUTION_1 --> EXECUTION_2
                              EXECUTION_2 -->|输入或结果变化| RECHECK
                              EXECUTION_2 -->|当前证据可用| OUTPUTS
                              RECHECK --> EXECUTION_3
                              EXECUTION_3 --> RETURN
                              OUTPUTS --> EXIT
                              EXIT -->|是| READY
                              EXIT -->|仍缺条件| PAUSE
                              READY --> END
                              PAUSE --> END
                              RETURN --> END
                          ```
