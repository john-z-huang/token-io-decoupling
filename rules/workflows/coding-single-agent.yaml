# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: workflow-route
id: coding-single-agent
markdown_path: workflows/coding-single-agent.md
title: 单代理 Coding
flowchart_references:
  DELEGATION: ../hooks/delegation.yaml#trigger
  RECOVERY: ../hooks/recovery.yaml#trigger
blocks:
  - overview:
      kind: markdown
      text: |-
        用户明确要求不创建或不使用子代理，或者任务没有值得独立委派的部分时，主代理自行完成需求分析、计划、执行、验证与交付。
  - flowchart:
      kind: section
      title: 工作流路线图
      blocks:
        - flowchart-body:
            kind: markdown
            text: |-
              从「开始」按当前事件进入相应分支。实线表示默认推进或收束，虚线表示条件分支。「结束」汇集本次流程的完成、受阻和转交结果。每个 Hook 的细则见同页子流程图。按[流程控制](coding-single-agent.yaml#returns)判断受影响工作的落点。

              ```mermaid
              flowchart TD
                  START(["开始"])
                  SM01["SM01 需求确认 · 入口 Hook"]
                  SM02["SM02 任务规划 · 规划 Hook"]
                  SM03["SM03 任务执行 · 主代理执行 Hook"]
                  SM04["SM04 结果验证 · 验证 Hook"]
                  SM05["SM05 交付 · 交付 Hook"]
                  DONE["完成"]
                  DELEGATION["进入多代理路线的就绪阶段，派发前应用委派 Hook"]
                  INTERRUPTION["任意阶段中断、调用失败或效果不明"]
                  RECOVERY["恢复 Hook · 核实效果、剩余工作与未决事项"]
                  RESUME["按进入条件重返 SM01 至 SM05 中已就绪的落点"]
                  BLOCKED["报告阻断和恢复条件"]
                  END(["结束"])
                  START -->|正常进入路线| SM01
                  START -. 遇到中途事件 .-> INTERRUPTION
                  SM01 -->|边界明确且沿用单代理路线| SM02
                  SM02 -->|工作就绪且获准| SM03
                  SM03 -->|产物和操作证据可验证| SM04
                  SM04 -->|必要验收通过| SM05
                  SM05 -->|实际交付物通过适用验收| DONE
                  SM01 -. 用户约束允许且重新选入多代理 .-> DELEGATION
                  SM02 -. 无需实施或已有有效产物与证据 .-> SM04
                  SM02 -. 目标、授权或验收有变 .-> SM01
                  SM03 -. 用户约束变化 .-> SM01
                  SM03 -. 前置、资源或工作顺序变化 .-> SM02
                  SM04 -. 原范围内修复后复验 .-> SM03
                  SM04 -. 修复需重新规划 .-> SM02
                  SM04 -. 验收或授权变化 .-> SM01
                  SM04 -. 必要证据或独立验证无法补齐 .-> SM05
                  SM05 -. 产物或验证状态变化 .-> SM04
                  SM05 -. 目标、授权或验收变化 .-> SM01
                  INTERRUPTION -. 暂停受影响工作并回读实际状态 .-> RECOVERY
                  RECOVERY -. 证据和授权支持续接 .-> RESUME
                  RECOVERY -. 无法恢复且其余工作已处理 .-> SM05
                  SM05 -. 必要验收受阻 .-> BLOCKED
                  DONE --> END
                  BLOCKED --> END
                  DELEGATION --> END
                  RESUME --> END
              ```
        - hook-details:
            kind: rule_include
            document: coding-workflow-directory
            fragment: hook-flowcharts
  - checkpoints:
      kind: section
      title: 阶段与适用 Hook
      blocks:
        - preconditions:
            kind: markdown
            text: |-
              从路线选择器进入。主代理掌握当前用户指令、任务范围和验收条件，在当前会话按任务推进。
        - SM01:
            kind: route_step
            title: 需求确认
            phase: entry
            hook: entry
            text: |-
              按[入口 Hook](../hooks/entry.yaml)确认目标、用户约束、交付物和验收条件。任务边界足以选路和规划时退出。
        - SM02:
            kind: route_step
            title: 任务规划
            phase: definition
            hook: planning
            text: |-
              基于已确认的任务边界进入[规划 Hook](../hooks/planning.yaml)。逐项核对同页 Hook 子流程，明确适用条件、证据与回退位置，再确定近期工作、依赖、主代理职责和验收办法。委派子项在单代理路线标为不适用，变更分工约束时重新选路。
        - SM03:
            kind: route_step
            title: 任务执行
            phase: execution
            hook: execution
            text: |-
              按[主代理执行 Hook](../hooks/execution.yaml)核对当前计划、前置结果和授权后执行。当前工作产物可验证时交给下游，必要条件未满足时暂停本项工作。
        - SM04:
            kind: route_step
            title: 结果验证
            phase: verification
            hook: verification
            text: |-
              按[验证 Hook](../hooks/verification.yaml)用当前产物和实际检查核对验收条件。必要验收均有当前证据时通过，失败或缺证据的项目进入流程控制。
        - SM05:
            kind: route_step
            title: 交付
            phase: delivery
            hook: delivery
            text: |-
              准备交付或报告阻断时进入[交付 Hook](../hooks/delivery.yaml)，核对实际产物和验证状态。通过适用验收后结束为完成，受阻时说明缺项。
  - returns:
      kind: section
      title: 变更与流程控制
      expose: true
      blocks:
        - returns-body:
            kind: markdown
            text: |-
              先按[阶段进入与退出](README.yaml#section-01)核对证据，再依据变化选择落点。

              | 变化或当前状态 | Hook 与落点 |
              | --- | --- |
              | 目标、范围、授权、验收或代理约束改变 | 回到 SM01，按[入口 Hook](../hooks/entry.yaml)重查变化。分工约束或可用能力影响路线时，按[路线选择](coding.yaml)重新判断。明确的单代理约束持续适用。沿用本路线时，回到 SM02 更新受影响的计划。切换后进入选定路线中满足条件的阶段。 |
              | 前置任务、资源或顺序变化 | 回到 SM02，按[规划 Hook](../hooks/planning.yaml)调整相关依赖、顺序及验收办法。待 SM03 所需前置和授权就绪后恢复该项工作。 |
              | 已有产物满足当前执行要求，或该项只需复核 | 当前产物、计划和前置证据满足进入条件时，可从 SM02 直接进入 SM04。按[验证 Hook](../hooks/verification.yaml)核对当前状态及证据时效。 |
              | 验证发现缺陷或交付物发生变化 | SM04 按[验证 Hook](../hooks/verification.yaml)核对修复范围。原范围内的修复回到 SM03，涉及范围或计划变更时回到 SM01 或 SM02。修复后回到 SM04 复核受影响项。交付期间证据过期也回到 SM04，必要验收通过后再回 SM05。 |
              | 中断、调用失败或操作结果不明 | 先按[恢复 Hook](../hooks/recovery.yaml)核对真实状态和已发生的效果，避免重复操作。核实恢复条件后回到原阶段或修订后计划的就绪阶段。无法恢复时，按 SM05 报告具体阻断。 |
  - mode-boundary:
      kind: section
      title: 模式边界
      expose: true
      blocks:
        - mode-boundary-body:
            kind: markdown
            text: |-
              主代理亲自承担所有任务和验证。需要独立人员或独立代理的验收条件若无法满足，保留证据并报告缺口。
  - related:
      kind: section
      title: 按条件触发的 Hooks
      blocks:
        - related-body:
            kind: markdown
            text: |-
              按当前动作查阅[Hook 触发目录](../hooks/README.yaml)，遇到中断或未知效果时读取[恢复 Hook](../hooks/recovery.yaml)。
