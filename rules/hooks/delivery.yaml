# yaml-language-server: $schema=../reference.schema.json
schema_version: 1
document_type: hook-contract
id: delivery
markdown_path: hooks/delivery.md
title: 交付 Hook
activate_on: [delivery, acceptance_changed, result_changed]
blocks:
  - trigger:
      kind: section
      title: 触发条件
      blocks:
        - trigger-body:
            kind: markdown
            text: |-
              主代理准备结束当前任务、交付结果或报告受阻工作时。
  - inputs:
      kind: section
      title: 输入与证据
      blocks:
        - inputs-body:
            kind: markdown
            text: |-
              用户指令与验收条件、实际产物、验证结果及适用的委派结果。
  - execution:
      kind: section
      title: 执行要求
      blocks:
        - execution-body:
            kind: markdown
            text: |-
              1. 主代理确认交付物可用，按[结果报告规则](../references/verification/verification-reporting.yaml)陈述实际产物、检查结果和影响验收的未完成事项。
              2. 将生成、修改及其他效果与证据对应。超出范围的后续操作按用户授权另行判断。
              3. 若用户输入或现有结果发生变化，回到受影响的任务或验证项，更新交付状态。
  - outputs:
      kind: section
      title: 输出与落点
      blocks:
        - outputs-body:
            kind: markdown
            text: |-
              最终结果、必要验证状态和可核对的交付物链接，或受阻事项和恢复所需信息。
  - exit:
      kind: section
      title: 退出与阻断
      blocks:
        - exit-body:
            kind: markdown
            text: |-
              用户要求的交付物通过适用验收后结束任务。仍受阻时明确尚缺条件。
  - recheck:
      kind: section
      title: 重新核验
      blocks:
        - recheck-body:
            kind: markdown
            text: |-
              交付物、验收要求或验证状态变化时重新核对受影响项。
  - sources:
      kind: section
      title: 规则来源
      blocks:
        - sources-body:
            kind: markdown
            text: |-
              主代理的最终责任见[验收与交付证据](../references/roles/main-agent.yaml#handoff)。
