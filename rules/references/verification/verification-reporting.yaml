# yaml-language-server: $schema=../../reference.schema.json
schema_version: 1
id: verification-reporting
markdown_path: references/verification/verification-reporting.md
title: 验证结果报告
blocks:
  - results:
      kind: section
      title: 按验收条件记录结果
      expose: true
      blocks:
        - results-body:
            kind: markdown
            text: |-
              逐项列明验收条件、当前产物状态、检查方法及可复核的实际证据。标明真实运行、模拟覆盖或结论所依赖的假设，并只按证据覆盖的范围判断结果。

              - **通过（PASS）**。当前证据满足该项要求。
              - **失败（FAIL）**。实际检查失败，或当前证据显示该项不满足要求。记录问题位置及影响。
              - **跳过（SKIPPED）**。检查不适用，或允许省略且实际未执行。注明具体理由。
              - **受阻（BLOCKED）**。必要的检查、能力、前置条件、独立性或证据仍有缺口。说明缺口、原因及其影响的验收条件或下游任务。

              说明未解决事项和残余风险，核对汇总结论是否反映各项实际结果。
