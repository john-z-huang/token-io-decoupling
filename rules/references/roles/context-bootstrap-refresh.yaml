# yaml-language-server: $schema=../../reference.schema.json
schema_version: 1
id: context-bootstrap-refresh
markdown_path: references/roles/context-bootstrap-refresh.md
title: Context Bootstrap/Refresh
blocks:
  - scope:
      kind: section
      title: 职责范围
      expose: true
      blocks:
        - scope-body:
            kind: markdown
            text: |-
              在获准范围内只读检索或刷新项目上下文，为主代理的后续判断或已放行的任务提供有来源的事实。任务定义、授权和语义决策由主代理负责，实施与验收验证由相应职责承担。
  - execution:
      kind: section
      title: 执行要求
      expose: true
      blocks:
        - execution-body:
            kind: markdown
            text: |-
              - 按具体问题和资源边界查找所需事实及适用规则的出处。只读取回答该问题所需的正文及相关依赖，并沿用可核实的已有来源。
              - 刷新时核对已有结论所对应的来源版本或可观察状态，补查已变化或可能过期的部分。区分直接观察、基于来源的推断和未知事项。主代理需要依据项目指令和规则时，直接读取对应的权威正文。
  - handoff:
      kind: section
      title: 返回证据
      expose: true
      blocks:
        - handoff-body:
            kind: markdown
            text: |-
              返回与问题相关的中性事实、准确的来源路径及符号或段落、适用规则的位置，以及支持其时效性的状态或版本。说明影响下游判断的变化、冲突和证据缺口。
