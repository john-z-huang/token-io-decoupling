# yaml-language-server: $schema=../../reference.schema.json
schema_version: 1
id: task-planning
markdown_path: references/planning/task-planning.md
title: 任务规划与选路
blocks:
  - route-selection:
      kind: section
      title: 根据用户要求选路
      expose: true
      blocks:
        - route-selection-body:
            kind: markdown
            text: |-
              1. 用户明确要求不创建或不使用子代理时，选单代理路线，由主代理完成全部工作。
              2. 用户明确要求委派时，选多代理路线，按满足该要求所需的分工安排任务。确实缺少必要委派能力时，记录无法满足的要求，推进其余获准工作。
              3. 其余任务由主代理评估分工收益。子任务有明确问题或可验收产物、可限定工作边界，且并行、专门能力或独立验证带来的收益能抵消交接成本时，选多代理路线。小范围、紧耦合、交接成本较高的任务适用单代理路线。
  - task-boundaries:
      kind: section
      title: 划分任务与依赖
      expose: true
      blocks:
        - task-boundaries-body:
            kind: markdown
            text: |-
              - 从用户的目标、交付物、验收条件和授权范围倒推任务。为每个工作项明确预期结果、依赖的输入、可影响的资源及负责人。简单任务可用一句话记下下一步和验收条件。
              - 主代理承担跨任务取舍、集成与最终验收。按[执行者与依赖规则](task-assignment.yaml)确定分工、交接顺序和独立验证要求。找不到合适角色时按[主代理职责](../roles/main-agent.yaml#execution)调整分工或报告缺口。
              - 待前置产物就绪再派发依赖任务。子代理数量随当前可派发工作、已占用角色及环境容量动态确定，无需要求用户输入数量或预先锁定配额。派发前按[同角色复用规则](../delegation/delegation-policy.yaml#reuse)核对现有记录。
  - plan-updates:
      kind: section
      title: 按新证据调整计划
      expose: true
      blocks:
        - plan-updates-body:
            kind: markdown
            text: |-
              - 用户调整目标、权限或验收，或现有任务暴露新依赖时，重查受影响的任务是否仍需委派，更新优先级、范围和验收条件。保留已核验的产物、角色与真实派发记录。
              - 用户明确给出的委派约束持续适用，直到用户修改该约束。需要改变路线时再次核对约束。新约束使在途任务失效时，先处理在途效果和冲突，再派发受影响工作。继续推进与未决结果无关的获准任务。
