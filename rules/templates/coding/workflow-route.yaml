layouts:
  - [overview, flowchart, checkpoints, returns, mode-boundary, related]
block_rules:
  overview:
    kind: markdown
  flowchart:
    kind: section
    child_kinds:
      - markdown
      - rule_include
  checkpoints:
    kind: section
    child_kinds:
      - markdown
      - route_step
  returns:
    kind: section
    expose: true
  mode-boundary:
    kind: section
    expose: true
  related:
    kind: section
document:
  schema_version: 1
  document_type: workflow-route
  id: example-workflow-route
  markdown_path: workflows/example-workflow-route.md
  title: 工作流路线示例
  blocks:
    - overview:
        kind: markdown
        text: |-
          说明适用 Mode、主阶段与按条件应用 Hook 的方式。
    - flowchart:
        kind: section
        title: 工作流路线图
        blocks:
          - flowchart-body:
              kind: markdown
              text: |-
                从「开始」进入各适用分支，所有出口汇入「结束」。实线表示默认推进或收束，虚线标出条件分支。

                ```mermaid
                flowchart TD
                    START(["开始"])
                    EX01[入口就绪]
                    EX02[任务规划]
                    EX03[执行]
                    EX04[验证]
                    EX05[交付]
                    DONE[完成]
                    END(["结束"])
                    START --> EX01
                    EX01 --> EX02
                    EX02 --> EX03
                    EX03 --> EX04
                    EX04 --> EX05
                    EX05 --> DONE
                    DONE --> END
                    EX03 -.-> EX02
                    EX02 -.-> EX04
                    EX04 -.-> EX03
                ```
          - hook-details:
              kind: rule_include
              document: coding-workflow-directory
              fragment: hook-flowcharts
    - checkpoints:
        kind: section
        title: 阶段与适用 Hook
        blocks:
          - preconditions:
              kind: markdown
              text: |-
                说明当前阶段所需的前置证据，以及适用 Hook 的进入与退出条件。
          - EX01:
              kind: route_step
              title: 入口就绪
              phase: entry
              hook: entry
              text: |-
                调用[阶段 Hook](../hooks/entry.yaml)。
          - EX02:
              kind: route_step
              title: 任务规划
              phase: definition
              hook: planning
              text: |-
                调用[阶段 Hook](../hooks/planning.yaml)。
          - EX03:
              kind: route_step
              title: 执行
              phase: execution
              hook: execution
              text: |-
                调用[阶段 Hook](../hooks/execution.yaml)。
          - EX04:
              kind: route_step
              title: 验证与修复
              phase: verification
              hook: verification
              text: |-
                调用[阶段 Hook](../hooks/verification.yaml)。
          - EX05:
              kind: route_step
              title: 交付与验收
              phase: delivery
              hook: delivery
              text: |-
                调用[阶段 Hook](../hooks/delivery.yaml)。
    - returns:
        kind: section
        title: 变更与流程控制
        expose: true
        blocks:
          - returns-body:
              kind: markdown
              text: |-
                按[阶段进入与退出](README.yaml#section-01)核对证据。为每类变化说明适用 Hook、目标阶段及继续条件。

                | 变化或当前状态 | Hook 与落点 |
                | --- | --- |
                | 依赖变化 | 回到 EX02 按[规划 Hook](../hooks/planning.yaml)更新受影响工作，前置就绪后继续。 |
                | 已有产物可用 | 确认执行阶段证据仍有效后，直接进入 EX04 按[验证 Hook](../hooks/verification.yaml)验收。 |
                | 验证发现缺陷 | 按[验证 Hook](../hooks/verification.yaml)核对修复范围，原范围内回到 EX03 修复，再进入 EX04 复核。 |
                | 中断或效果不明 | 按[恢复 Hook](../hooks/recovery.yaml)回读实际状态，条件明确后回到就绪阶段。 |
    - mode-boundary:
        kind: section
        title: Mode 边界
        expose: true
        blocks:
          - mode-boundary-body:
              kind: markdown
              text: |-
                说明本路线读取的 Mode 证据及其允许效果。
    - related:
        kind: section
        title: 按条件触发的 Hooks
        blocks:
          - related-body:
              kind: markdown
              text: |-
                从 [Hook 触发目录](../hooks/README.yaml)定位适用合同。
