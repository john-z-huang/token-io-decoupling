name: Multilingual Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "instruction-compiler/**"
      - ".agents/skills/token-io-decoupling-dev/**"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-doc-layer-links.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/workflow_module_contracts.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/markdown_discovery.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-multilingual-docs.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-01-sections.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-02-04-provider-neutrality.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-04-workflow-maps.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-workflow-checkpoints.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_workflow_checkpoints.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_doc_layer_links.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check_coding_document_migration.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_coding_document_migration.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_check_layer_04_workflow_maps.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_markdown_discovery.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-context-exchange.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_check_context_exchange.py"
      - ".gitignore"
      - ".github/workflows/multilingual-docs.yml"
      - "instruction-compiler/sources/rule-registry.json"
      - "mcp/packages/token_io_decoupling_core/**"
      - "mcp/pyproject.toml"
      - ".agents/skills/token-io-decoupling-dev/references/migrations/coding-document-migration.json"
      - ".agents/skills/token-io-decoupling-dev/references/migrations/workflow-module-migration.json"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "instruction-compiler/**"
      - ".agents/skills/token-io-decoupling-dev/**"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-doc-layer-links.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/workflow_module_contracts.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/markdown_discovery.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-multilingual-docs.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-01-sections.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-02-04-provider-neutrality.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-layer-04-workflow-maps.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-workflow-checkpoints.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_workflow_checkpoints.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_doc_layer_links.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check_coding_document_migration.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_coding_document_migration.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_check_layer_04_workflow_maps.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_markdown_discovery.py"
      - ".agents/skills/token-io-decoupling-dev/scripts/check-context-exchange.py"
      - ".agents/skills/token-io-decoupling-dev/tests/docs/test_check_context_exchange.py"
      - ".gitignore"
      - ".github/workflows/multilingual-docs.yml"
      - "instruction-compiler/sources/rule-registry.json"
      - "mcp/packages/token_io_decoupling_core/**"
      - "mcp/pyproject.toml"
      - ".agents/skills/token-io-decoupling-dev/references/migrations/coding-document-migration.json"
      - ".agents/skills/token-io-decoupling-dev/references/migrations/workflow-module-migration.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify compiled instruction freshness
        run: python3 instruction-compiler/compile.py compile --check

      - name: Run instruction compiler regressions
        run: python3 -m unittest discover -s instruction-compiler/tests -p 'test_*.py'

      - name: Validate multilingual documentation
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-multilingual-docs.py

      - name: Validate Markdown layer links
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-doc-layer-links.py

      - name: Validate coding document migration and navigation
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check_coding_document_migration.py

      - name: Run coding document migration regressions
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_coding_document_migration.py'

      - name: Run Markdown layer-link regressions
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_doc_layer_links.py'

      - name: Run bounded Markdown discovery regressions
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_markdown_discovery.py'

      - name: Validate Layer-01 document sections
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-layer-01-sections.py

      - name: Validate Layer-02 through Layer-04 provider neutrality
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-layer-02-04-provider-neutrality.py

      - name: Validate Layer-03 decision owners and route consumption
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-workflow-checkpoints.py

      - name: Run Layer-03 workflow checkpoint regressions
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_workflow_checkpoints.py'

      - name: Validate Context Exchange preservation
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-context-exchange.py

      - name: Run Context Exchange regression tests
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_check_context_exchange.py'

      - name: Validate Layer-04 workflow maps and their bilingual structure
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-layer-04-workflow-maps.py

      - name: Run Layer-04 workflow map regression tests
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_check_layer_04_workflow_maps.py'
