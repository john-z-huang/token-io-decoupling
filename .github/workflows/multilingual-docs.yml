name: Multilingual Docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "agents/openai.yaml"
      - "scripts/check-multilingual-docs.py"
      - "scripts/check-layer-01-sections.py"
      - "scripts/check-layer-02-03-provider-neutrality.py"
      - "scripts/check-layer-03-workflow-maps.py"
      - "tests/test_check_layer_03_workflow_maps.py"
      - "scripts/check-context-exchange.py"
      - "tests/test_check_context_exchange.py"
      - ".gitignore"
      - ".github/workflows/multilingual-docs.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "agents/openai.yaml"
      - "scripts/check-multilingual-docs.py"
      - "scripts/check-layer-01-sections.py"
      - "scripts/check-layer-02-03-provider-neutrality.py"
      - "scripts/check-layer-03-workflow-maps.py"
      - "tests/test_check_layer_03_workflow_maps.py"
      - "scripts/check-context-exchange.py"
      - "tests/test_check_context_exchange.py"
      - ".gitignore"
      - ".github/workflows/multilingual-docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate multilingual documentation
        run: python3 scripts/check-multilingual-docs.py

      - name: Validate Layer-01 document sections
        run: python3 scripts/check-layer-01-sections.py

      - name: Validate Layer-02 and Layer-03 provider neutrality
        run: python3 scripts/check-layer-02-03-provider-neutrality.py

      - name: Validate Context Exchange preservation
        run: python3 scripts/check-context-exchange.py

      - name: Run Context Exchange regression tests
        run: python3 -m unittest discover -s tests -p 'test_check_context_exchange.py'

      - name: Validate Layer-03 workflow maps and their bilingual structure
        run: python3 scripts/check-layer-03-workflow-maps.py

      - name: Run Layer-03 workflow map regression tests
        run: python3 -m unittest discover -s tests -p 'test_check_layer_03_workflow_maps.py'
