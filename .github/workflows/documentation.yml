name: 文档检查

on:
  pull_request:
    paths:
      - "**/*.md"
      - "instruction-compiler/**"
      - ".agents/skills/token-io-decoupling-dev/**"
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "mcp/packages/token_io_decoupling_core/**"
      - "mcp/pyproject.toml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "instruction-compiler/**"
      - ".agents/skills/token-io-decoupling-dev/**"
      - ".github/workflows/documentation.yml"
      - "docs/**"
      - "mcp/packages/token_io_decoupling_core/**"
      - "mcp/pyproject.toml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"

      - name: Verify compiled instruction freshness
        run: python3 instruction-compiler/compile.py compile --check

      - name: Run instruction compiler regressions
        run: uv run --no-project --with-editable ./instruction-compiler python -m unittest discover -s instruction-compiler/tests -p 'test_*.py'

      - name: Validate Chinese documentation
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-chinese-docs.py

      - name: Validate Markdown links and dependency boundaries
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-doc-layer-links.py

      - name: Validate current Hook contracts and historical provenance
        run: python3 .agents/skills/token-io-decoupling-dev/scripts/check-workflow-checkpoints.py

      - name: Run complete documentation regressions
        run: python3 -m unittest discover -s .agents/skills/token-io-decoupling-dev/tests/docs -p 'test_*.py'
